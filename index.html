<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>綜合遊戲樂園</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <!-- 遊戲大廳主頁 -->
    <div id="lobby-view">
      <h1>🎮 綜合遊戲樂園</h1>
      <div class="user-bar">
        <button id="auth-open-btn" class="auth-btn">🔑 登入 / 註冊</button>
        <span id="user-status" class="status-badge offline">🔴 未登入 (進度不會儲存)</span>
      </div>

      <h3>🔥 選擇遊戲</h3>
      <div class="game-hall-grid">
        <!-- 點擊直接跳轉至子資料夾的數獨 -->
        <a href="./sudoku/index.html" class="game-card-btn">
          <div class="game-icon">🧩</div>
          <strong>20 關數獨挑戰</strong>
          <p>邏輯推理與經典數獨關卡</p>
        </a>

        <!-- 未來新增遊戲直接在這裡加 <a> 標籤即可 -->
      </div>
    </div>

  </div>

  <!-- 登入 / 註冊 彈窗 -->
  <div id="auth-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" id="auth-close-btn">&times;</span>
      
      <div class="tab-header">
        <button id="tab-login-btn" class="tab-btn active">登入</button>
        <button id="tab-register-btn" class="tab-btn">註冊帳號</button>
      </div>

      <div id="login-form" class="auth-form">
        <input type="text" id="login-user" placeholder="請輸入帳號">
        <input type="password" id="login-pass" placeholder="請輸入密碼">
        <button onclick="handleLogin()" class="submit-btn">登入</button>
      </div>

      <div id="register-form" class="auth-form" style="display: none;">
        <input type="text" id="reg-user" placeholder="請設定帳號">
        <input type="password" id="reg-pass1" placeholder="請設定密碼">
        <input type="password" id="reg-pass2" placeholder="請再次輸入密碼">
        <button onclick="handleRegister()" class="submit-btn reg">完成註冊並登入</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
