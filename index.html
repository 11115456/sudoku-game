<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20關數獨闖關遊戲</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🧩 20 關數獨挑戰</h1>
    
    <!-- 帳號登入區域 -->
    <div id="auth-box">
      <input type="text" id="username" placeholder="請輸入帳號名">
      <button onclick="login()">登入 / 載入進度</button>
    </div>
    <p id="user-info">目前狀態：未登入（進度將不會儲存）</p>

    <!-- 1. 關卡目錄頁面 -->
    <div id="menu-view">
      <h3>🎯 選擇關卡</h3>
      <div id="level-menu" class="level-grid"></div>
    </div>

    <!-- 2. 數獨遊戲主頁面 (預設隱藏) -->
    <div id="game-view" style="display: none;">
      <div class="level-bar">
        <button onclick="backToMenu()">◀ 返回目錄</button>
        <span id="level-title">第 1 關</span>
        <span></span>
      </div>
      
      <div id="guide-text" class="guide">
        💡 <b>提示</b>：點選數字再點格子可填寫草稿（淺色），再點一次確認填入（深色）。
      </div>

      <!-- 9x9 數獨棋盤 -->
      <div id="grid" class="sudoku-grid"></div>

            <!-- 數字鍵盤 -->
      <div class="number-pad">
        <button class="num-btn" onclick="selectNumber(1, this)">1</button>
        <button class="num-btn" onclick="selectNumber(2, this)">2</button>
        <button class="num-btn" onclick="selectNumber(3, this)">3</button>
        <button class="num-btn" onclick="selectNumber(4, this)">4</button>
        <button class="num-btn" onclick="selectNumber(5, this)">5</button>
        <button class="num-btn" onclick="selectNumber(6, this)">6</button>
        <button class="num-btn" onclick="selectNumber(7, this)">7</button>
        <button class="num-btn" onclick="selectNumber(8, this)">8</button>
        <button class="num-btn" onclick="selectNumber(9, this)">9</button>
        <button class="num-btn erase-btn" onclick="selectNumber(0, this)">橡皮擦</button>
      </div>



      
      <div class="actions">
        <button onclick="checkAnswer()">提交並驗證答案</button>
        <button onclick="saveProgress()" class="save-btn">☁ 儲存進度到雲端</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
