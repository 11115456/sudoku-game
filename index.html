<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>綜合遊戲樂園</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <!-- 1. 主首頁：遊戲大廳 -->
    <div id="lobby-view">
      <h1>🎮 綜合遊戲樂園</h1>
      <div class="user-bar">
        <button id="auth-open-btn" class="auth-btn">🔑 登入 / 註冊</button>
        <span id="user-status" class="status-badge offline">🔴 未登入 (進度不會儲存)</span>
      </div>

      <h3>🔥 選擇遊戲</h3>
      <div class="game-hall-grid">
        <!-- 改為真實按鈕元件 -->
        <button id="sudoku-game-btn" class="game-card-btn">
          <div class="game-icon">🧩</div>
          <strong>20 關數獨挑戰</strong>
          <p>邏輯推理與經典數獨關卡</p>
        </button>
      </div>
    </div>

    <!-- 2. 數獨關卡目錄頁 -->
    <div id="menu-view" style="display: none;">
      <div class="top-nav">
        <button id="back-to-lobby-btn" class="nav-back-btn">◀ 返回遊戲大廳</button>
      </div>
      <h2>🧩 20 關數獨挑戰</h2>
      <h3>🎯 選擇關卡</h3>
      <div id="level-menu" class="level-grid"></div>
    </div>

    <!-- 3. 數獨遊戲主頁面 -->
    <div id="game-view" style="display: none;">
      <div class="level-bar">
        <button onclick="backToMenu()">◀ 返回關卡目錄</button>
        <span id="level-title">第 1 關</span>
        <span id="timer-display" class="timer">⏱️ 00:00:00</span>
      </div>
      
      <div id="guide-text" class="guide">
        💡 <b>提示</b>：點選數字再點格子可填寫草稿（淺色），再點一次確認填入（深色）。
      </div>

      <div id="grid" class="sudoku-grid"></div>

      <div class="number-pad">
        <button class="num-btn" onclick="selectNumber(1, this)">1</button>
        <button class="num-btn" onclick="selectNumber(2, this)">2</button>
        <button class="num-btn" onclick="selectNumber(3, this)">3</button>
        <button class="num-btn" onclick="selectNumber(4, this)">4</button>
        <button class="num-btn" onclick="selectNumber(5, this)">5</button>
        <button class="num-btn" onclick="selectNumber(6, this)">6</button>
        <button class="num-btn" onclick="selectNumber(7, this)">7</button>
        <button class="num-btn" onclick="selectNumber(8, this)">8</button>
        <button class="num-btn" onclick="selectNumber(9, this)">9</button>
        <button class="num-btn erase-btn" onclick="selectNumber(0, this)">橡皮擦</button>
      </div>

      <div class="actions">
        <button onclick="checkAnswer()">提交並驗證答案</button>
        <button onclick="saveProgress()" class="save-btn">☁ 儲存進度到雲端</button>
      </div>
    </div>

  </div>

  <!-- 登入 / 註冊 彈窗 -->
  <div id="auth-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" id="auth-close-btn">&times;</span>
      
      <div class="tab-header">
        <button id="tab-login-btn" class="tab-btn active">登入</button>
        <button id="tab-register-btn" class="tab-btn">註冊帳號</button>
      </div>

      <div id="login-form" class="auth-form">
        <input type="text" id="login-user" placeholder="請輸入帳號">
        <input type="password" id="login-pass" placeholder="請輸入密碼">
        <button onclick="handleLogin()" class="submit-btn">登入</button>
      </div>

      <div id="register-form" class="auth-form" style="display: none;">
        <input type="text" id="reg-user" placeholder="請設定帳號">
        <input type="password" id="reg-pass1" placeholder="請設定密碼">
        <input type="password" id="reg-pass2" placeholder="請再次輸入密碼">
        <button onclick="handleRegister()" class="submit-btn reg">完成註冊並登入</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
