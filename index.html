<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>綜合遊戲樂園</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 讓遊戲選擇區塊固定高度並支援上下下拉捲動，後續新增遊戲自動收納 */
    .game-hall-grid {
      display: flex !important;
      flex-direction: column !important;
      gap: 12px;
      max-height: 360px;
      overflow-y: auto;
      padding: 4px 6px 4px 2px;
      scroll-behavior: smooth;
    }

    .game-hall-grid::-webkit-scrollbar {
      width: 6px;
    }

    .game-hall-grid::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }

    .game-hall-grid .game-card-btn {
      width: 100%;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .scroll-hint {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: normal;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- 遊戲大廳主頁 -->
    <div id="lobby-view">
      <h1>🎮 綜合遊戲樂園</h1>
      <div class="user-bar">
        <button id="auth-open-btn" class="auth-btn">🔑 登入 / 註冊</button>
        <span id="user-status" class="status-badge offline">🔴 未登入 (進度不會儲存)</span>
      </div>

      <h3>🔥 選擇遊戲 <span class="scroll-hint">(可上下滑動選擇 ↕)</span></h3>
      <div class="game-hall-grid">
        <!-- 遊戲 1：數獨 -->
        <a href="./sudoku/index.html" class="game-card-btn">
          <div class="game-icon">🧩</div>
          <strong>20 關數獨挑戰</strong>
          <p>邏輯推理與經典數獨關卡</p>
        </a>

        <!-- 遊戲 2：CYBER BEAT 音遊 -->
        <a href="./rhythm/index.html" class="game-card-btn rhythm-theme">
          <div class="game-icon">🎹</div>
          <strong>CYBER BEAT 音遊</strong>
          <p>4~7 軌科技節奏打擊（支援 PC 與多點觸控）</p>
        </a>

        <!-- 遊戲 3：跑酷大冒險 -->
        <a href="./parkour/index.html" class="game-card-btn parkour-theme">
          <div class="game-icon">🏃‍♂️</div>
          <strong>極限跑酷大冒險</strong>
          <p>二段跳與滑行閃避，挑戰極限速度！</p>
        </a>

        <!-- 👇 以後要新增第 4、第 5 款遊戲，直接貼在這裡上面即可，會自動變成下拉滾動清單！ -->
      </div>
    </div>

  </div>

  <!-- 登入 / 註冊 彈窗 -->
  <div id="auth-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" id="auth-close-btn">&times;</span>
      
      <div class="tab-header">
        <button id="tab-login-btn" class="tab-btn active">登入</button>
        <button id="tab-register-btn" class="tab-btn">註冊帳號</button>
      </div>

      <div id="login-form" class="auth-form">
        <input type="text" id="login-user" placeholder="請輸入帳號">
        <input type="password" id="login-pass" placeholder="請輸入密碼">
        <button onclick="handleLogin()" class="submit-btn">登入</button>
      </div>

      <div id="register-form" class="auth-form" style="display: none;">
        <input type="text" id="reg-user" placeholder="請設定帳號">
        <input type="password" id="reg-pass1" placeholder="請設定密碼">
        <input type="password" id="reg-pass2" placeholder="請再次輸入密碼">
        <button onclick="handleRegister()" class="submit-btn reg">完成註冊並登入</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
