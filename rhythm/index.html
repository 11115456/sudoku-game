<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER BEAT - 多軌科技音遊</title>
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <!-- 頂部狀態列 -->
  <header class="top-bar">
    <button id="back-lobby-btn" class="cyber-btn small">⬅ 返回大廳</button>
    <div id="user-badge" class="user-badge">訪客模式</div>
    <button id="pause-btn" class="cyber-btn small" style="display:none;">⏸ 暫停</button>
  </header>

  <!-- 選單與曲目選擇畫面 -->
  <main id="menu-screen" class="menu-screen">
    <h1 class="game-title">CYBER BEAT</h1>
    <p class="subtitle">支援 PC 鍵盤 (S D F Space J K L) 與平板/手機多點觸控</p>

    <!-- 曲目選擇列表 -->
    <div class="control-group song-group">
      <label>選擇曲目與難度 (Track Select)：</label>
      <div id="song-list" class="song-list"></div>
    </div>

    <!-- 軌道數選擇 -->
    <div class="control-group">
      <label>選擇軌道數 (Key Mode)：</label>
      <div class="key-selector" id="key-selector">
        <button class="mode-btn active" data-keys="4">4K</button>
        <button class="mode-btn" data-keys="5">5K</button>
        <button class="mode-btn" data-keys="6">6K</button>
        <button class="mode-btn" data-keys="7">7K</button>
      </div>
      <div id="key-hint" class="key-hint">對應按鍵：D - F - J - K</div>
    </div>

    <!-- 三項玩家自訂微調滑桿 -->
    <div class="sliders-grid">
      <div class="control-group slider-box">
        <label>下落流速：<span id="speed-val" class="highlight-val">8</span> <small>(1~15)</small></label>
        <input type="range" id="speed-slider" min="1" max="15" step="0.5" value="8">
      </div>
      <div class="control-group slider-box">
        <label>軌道寬度：<span id="width-val" class="highlight-val">100</span>%</label>
        <input type="range" id="width-slider" min="40" max="100" step="5" value="100">
      </div>
      <div class="control-group slider-box">
        <label>延遲微調：<span id="offset-val" class="highlight-val">0</span> ms</label>
        <input type="range" id="offset-slider" min="-150" max="150" step="5" value="0">
      </div>
    </div>

    <button id="start-btn" class="cyber-btn primary">▶ 開始演奏</button>
  </main>

  <!-- 遊戲主舞台（世界計畫風：無基座單一判定線） -->
  <section id="game-screen" class="game-screen" style="display:none;">
    <div class="hud">
      <div class="song-info-hud" id="hud-song-title">SONG TITLE [Lv.3]</div>
      <div class="score-box">SCORE: <span id="score">000000</span></div>
      <div class="combo-box">
        <div id="combo-num" class="combo-num">0</div>
        <div id="judge-text" class="judge-text">READY</div>
      </div>
    </div>

    <div id="stage-container" class="stage-container">
      <div id="lanes-wrapper" class="lanes-wrapper"></div>
      <div id="hit-line" class="hit-line"></div>
      <div class="bottom-buffer"></div>
    </div>
  </section>

  <!-- 結算視窗 -->
  <div id="result-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <h2>STAGE CLEAR</h2>
      <p id="res-song" class="res-song-title">Song Name</p>
      <p>模式：<span id="res-mode">4K</span> | 難度：<span id="res-lv">Lv.3</span></p>
      <p class="res-score-big">最終分數：<span id="res-score">0</span></p>
      <p id="res-best-notice" class="res-best-notice"></p>
      <p>最大連擊：<span id="res-max-combo">0</span></p>
      <p>PERFECT: <span id="res-perfect">0</span> | GOOD: <span id="res-good">0</span> | MISS: <span id="res-miss">0</span></p>
      <div class="modal-actions">
        <button id="retry-btn" class="cyber-btn primary">↻ 再玩一次</button>
        <button id="to-menu-btn" class="cyber-btn">回到選單</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=11"></script>
</body>
</html>
